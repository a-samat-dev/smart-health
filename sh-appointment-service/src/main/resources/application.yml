server:
  port: 8083

spring:
  application:
    name: sh-appointment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/${DB_NAME:smart_health}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: appointment_service
  flyway:
    schemas: appointment_service
    default-schema: appointment_service
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s
  cloud:
    circuitbreaker:
      resilience4j:
        # Calls run on the request thread, which keeps the trace id on them; the HTTP client's timeouts bound
        # each call instead of a time limiter.
        disable-thread-pool: true
        disable-time-limiter: true

appointments:
  slot-duration: ${APPOINTMENT_SLOT_DURATION:30m}

services:
  user-service: ${USER_SERVICE_URL:http://localhost:8081}
  doctor-service: ${DOCTOR_SERVICE_URL:http://localhost:8082}

openapi:
  # Swagger UI sends "Try it out" requests here: through the gateway, which reaches this service under
  # /appointment-service, so they pass its token check.
  server-url: ${GATEWAY_URL:http://localhost:8080}/appointment-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
